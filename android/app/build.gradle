plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "0.1.0"

android {
    namespace "com.safecall"
    compileSdk 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        // applicationId co dinh "com.safecall" theo HLD/LLD (package goc cho native module la com.safecall.callscreening)
        applicationId "com.safecall"
        // minSdkVersion = 29 theo ADR-006 (minSdkVersion=29) - bat buoc cho TelephonyCallback API 31+ dual-impl
        // va cho CallScreeningService/RoleManager on dinh tren day du thiet bi muc tieu.
        minSdkVersion 29
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // TODO (Phase 8 / cross-cutting): cau hinh signingConfig that truoc khi release.
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    // ContextCompat/NotificationCompat/NotificationManagerCompat (PermissionsModule,
    // ScamConfirmationNotifier, PendingPromptRegistry, CallMonitorService - Phase 1/4).
    implementation "androidx.core:core-ktx:1.13.1"
}
